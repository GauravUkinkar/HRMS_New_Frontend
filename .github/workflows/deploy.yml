name: Deploy Vite React to MilesWeb

on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Build Vite application
        run: npm run build

      - name: Deploy to MilesWeb
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.MILESWEB_HOST }}
          username: ${{ secrets.MILESWEB_USERNAME }}
          password: ${{ secrets.MILESWEB_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.MILESWEB_PATH }}
